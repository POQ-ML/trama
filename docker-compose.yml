services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trama}
      POSTGRES_DB: ${POSTGRES_DB:-trama}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trama}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: trama-api:local
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trama}:${POSTGRES_PASSWORD:-trama}@postgres:5432/${POSTGRES_DB:-trama}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}'
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_TELEMETRY_ENABLED: ${LLM_TELEMETRY_ENABLED:-true}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DISCOVERY_DEADLINE_SECONDS: ${DISCOVERY_DEADLINE_SECONDS:-120}
      DISCOVERY_TOP_K: ${DISCOVERY_TOP_K:-5}
      DISCOVERY_LLM_ENABLED: ${DISCOVERY_LLM_ENABLED:-false}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      MONITOR_FETCH_SECONDS: ${MONITOR_FETCH_SECONDS:-20}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    image: trama-api:local
    environment: *api_environment
    command: ["python", "-m", "scripts.discovery_worker"]
    restart: unless-stopped
    stop_grace_period: 130s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trama.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-trama}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "40"
      PGADMIN_CONFIG_FILE_LOG_LEVEL: "40"
      PGADMIN_CONFIG_MAX_SESSION_IDLE_TIME: "60"
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: "1"
      PGADMIN_CONFIG_MAX_QUERY_HIST_STORED: "20"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      # Monta apenas o diretório de dados do pgAdmin (SQLite interno + chaves).
      # Não monta /var/lib/pgadmin/storage para evitar acúmulo de exports/backups.
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
    restart: unless-stopped

  # Redis preparado para uso futuro (cache/filas). Não necessário na Initial Build.
  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
  pgadmin_data:
